<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="testerpage">
<main class="testerwrap">
  <div class="rolecard hidden" id="role">
    <div class="tag"><span>Your role</span><span>only you see this</span></div>
    <p id="brief"></p>
    <div class="tip">Type like your character would. The opening line is up to you.</div>
  </div>
  <div class="phone">
    <div class="bar"><div class="avatar" id="initial">A</div><div class="who"><b id="title">Assistant</b><span id="status">replies in a minute</span></div><div class="me hidden" id="me"><div class="face" id="meFace"></div><span id="meName"></span></div></div>
    <div class="chat" id="chat"></div>
    <form class="composer" id="form">
      <input type="text" id="text" placeholder="Message" autocomplete="off" aria-label="Message">
      <button id="send" aria-label="Send">➤</button>
    </form>
  </div>
</main>
<script>
const sid = new URLSearchParams(location.search).get('s');
const $ = (id) => document.getElementById(id);
let shown = -1;

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  return res.json();
}

async function poll() {
  if (!sid) { $('status').textContent = 'No session in this link. Ask the wizard for the link.'; return; }
  const st = await api(`/api/sessions/${sid}`);
  if (st.error) { $('status').textContent = st.error; return; }
  if (st.role && st.role.brief) { $('brief').textContent = st.role.brief; $('role').classList.remove('hidden'); }
  if (st.messages.length !== shown) {
    shown = st.messages.length;
    $('chat').innerHTML = '';
    for (const m of st.messages) {
      const d = document.createElement('div');
      d.className = `msg ${m.role}`;
      d.textContent = m.text;
      $('chat').appendChild(d);
    }
    $('chat').scrollTop = $('chat').scrollHeight;
  }
  if (st.ended) $('status').textContent = 'Session ended';
  $('send').disabled = st.ended;
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('text').value.trim();
  if (!text) return;
  $('text').value = '';
  await api(`/api/sessions/${sid}/user`, { text });
  poll();
});

fetch('/api/info').then((r) => r.json()).then((i) => {
  if (i.user_name) { $('meName').textContent = i.user_name; $('meFace').textContent = i.user_name.trim()[0].toUpperCase(); $('me').title = `Signed in as ${i.user_name}`; $('me').classList.remove('hidden'); }
  if (i.user_page_title) { document.title = i.user_page_title; $('title').textContent = i.user_page_title; $('initial').textContent = i.user_page_title.trim()[0].toUpperCase(); }
});
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
